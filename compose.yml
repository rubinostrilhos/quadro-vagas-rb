services: 
  db:
    image: postgres
    environment:
      TZ: 'America/Fortaleza'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TERM: xterm-256color
    ports:
      - '5432:5432'
    expose:
      - '5432'
    
  web:
    build: .
    stdin_open: true
    tty: true
    command: bash -c "rails server -p 3000 -b '0.0.0.0'"
    environment:
      TZ: 'America/Fortaleza'
      TERM: xterm-256color
    env_file:
      - ./.env.dev
    volumes:
      - .:/home/app/web
    ports:
      - '3000:3000'
