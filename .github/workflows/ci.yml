name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build

      - name: Start database container
        run: |
          docker compose -f docker-compose.yml up -d db

      - name: Wait for database to be ready
        run: |
          until docker compose -f docker-compose.yml exec -T db pg_isready -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Install gems
        run: |
          docker compose -f docker-compose.yml run --rm web bundle install

      - name: Set up database schema
        run: |
          docker compose -f docker-compose.yml run --rm web bin/rails db:prepare

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml run --rm web bin/rake spec

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby files
        run: bundle exec rubocop
